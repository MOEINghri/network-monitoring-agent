# =============================================================================
# devices.yaml — فایل تعریف دستگاه‌های تحت مانیتورینگ SNMP
# =============================================================================
#
# این فایل تنها جایی است که برای "اضافه کردن یک دستگاه جدید به مانیتورینگ"
# باید ویرایش شود. نیازی به تغییر کد پایتون نیست.
#
# هر آیتم زیر «devices:» یک دستگاه است با این فیلدها:
#
#   name         - یک اسم دلخواه و یکتا (فقط برای نمایش در لاگ‌ها و InfluxDB، هر چیزی باشد اوکی است)
#   host         - آدرس IP یا هاست‌نیم دستگاه
#   community    - SNMP community string دستگاه (روی خود دستگاه تنظیم می‌شود، پیش‌فرض معمولاً "public")
#   type         - نوع دستگاه؛ باید دقیقاً یکی از این مقادیر باشد:
#                    mikrotik  -> روتربردهای MikroTik (RouterOS)
#                    linux     -> سرور لینوکسی با net-snmp (snmpd) نصب و فعال
#                    windows   -> سرور ویندوزی با SNMP Service فعال
#                    cisco     -> تجهیزات Cisco (IOS/IOS-XE) - OID های CPU آن‌ها proprietary
#                                 است و ممکن است بین مدل‌های مختلف فرق کند؛ اگر جواب نگرفتی
#                                 OID مربوطه در device_profiles.py را بر اساس مستندات دستگاهت
#                                 تنظیم کن.
#                    generic   -> هر دستگاه دیگری که HOST-RESOURCES-MIB استاندارد را پیاده‌سازی
#                                 کرده (بیشتر سیستم‌عامل‌های امروزی این‌طور هستند)
#   interfaces   - لیست اسم اینترفیس‌هایی که می‌خواهیم ترافیکشان دیده شود.
#                  این اسم باید دقیقاً همان چیزی باشد که خود دستگاه با SNMP گزارش می‌دهد
#                  (مثلاً "ether1" روی میکروتیک، "eth0" روی لینوکس، "Ethernet" روی ویندوز).
#                  اگر اسم درست را نمی‌دانی، لاگ collector بعد از اولین اجرا لیست
#                  اینترفیس‌های پیدا شده روی آن دستگاه را چاپ می‌کند - از همان‌جا کپی کن.
#   disk_mount   - (اختیاری) مسیر دیسک/پارتیشنی که می‌خواهیم فضایش دیده شود
#                  (مثلاً "/" روی لینوکس یا "C:\\" روی ویندوز).
#                  دستگاه‌های شبکه‌ای مثل میکروتیک و سیسکو HOST-RESOURCES-MIB ندارند
#                  و این فیلد برایشان بی‌اثر است - می‌توانی حذفش کنی یا null بگذاری.
#
# نکته مهم: قبل از افزودن هر دستگاه، باید SNMP روی خودش فعال باشد:
#   - MikroTik : Winbox -> IP -> SNMP -> Enabled
#   - Linux    : sudo apt install snmpd  و تنظیم community در /etc/snmp/snmpd.conf
#   - Windows  : Control Panel -> Turn Windows features on/off -> SNMP Service
#   - Cisco    : در حالت config: snmp-server community <community> RO
#
# =============================================================================

devices:
  - name: mikrotik-router
    host: 192.168.1.1
    community: public
    type: mikrotik
    interfaces:
      - ether1

  - name: linux-server
    host: 192.168.1.50   # <-- این را با IP واقعی سرور لینوکس خودت جایگزین کن
    community: public
    type: linux
    interfaces:
      - eth0              # <-- اسم واقعی اینترفیس شبکه سرورت را اینجا بگذار
    disk_mount: "/"

  # نمونه‌ی غیرفعال برای آینده - وقتی سرور ویندوزی اضافه کردی، کامنت این بخش
  # را بردار و مقادیرش را با اطلاعات واقعی جایگزین کن.
  # - name: windows-server
  #   host: 192.168.1.60
  #   community: public
  #   type: windows
  #   interfaces:
  #     - Ethernet
  #   disk_mount: "C:\\"

  # نمونه‌ی غیرفعال برای آینده - برای دستگاه سیسکو.
  # - name: cisco-switch
  #   host: 192.168.1.2
  #   community: public
  #   type: cisco
  #   interfaces:
  #     - GigabitEthernet0/1
