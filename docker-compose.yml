version: "3.9"

services:
  influxdb:
    image: influxdb:2.7
    container_name: net-agent-influxdb
    ports:
      - "8086:8086"
    volumes:
      - influxdb-data:/var/lib/influxdb2
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=admin
      - DOCKER_INFLUXDB_INIT_PASSWORD=changeme123
      - DOCKER_INFLUXDB_INIT_ORG=net-agent
      - DOCKER_INFLUXDB_INIT_BUCKET=network-metrics
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=devtoken12345

  collector:
    build: ./network-collector
    container_name: net-agent-collector
    depends_on:
      - influxdb
    env_file: .env
    volumes:
      - ./network-collector:/app
    restart: unless-stopped

  agent:
    build: ./agent-core
    container_name: net-agent-core
    depends_on:
      - influxdb
      - guardrail
      - notifier
    env_file: .env
    volumes:
      - ./agent-core:/app
    restart: unless-stopped

  guardrail:
    build: ./guardrail-engine
    container_name: net-agent-guardrail
    env_file: .env
    volumes:
      - ./guardrail-engine:/app
    ports:
      - "8000:8000"
    restart: unless-stopped

  notifier:
    build: ./notifier
    container_name: net-agent-notifier
    env_file: .env
    volumes:
      - ./notifier:/app
    ports:
      - "8001:8001"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.0.0
    container_name: net-agent-grafana
    ports:
      - "3000:3000"
    depends_on:
      - influxdb
    volumes:
      - grafana-data:/var/lib/grafana

volumes:
  influxdb-data:
  grafana-data:
